
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Спутниковый мониторинг</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', 'Consolas', monospace;
            background: #0a0a0a;
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 100%);
            padding: 12px 20px;
            border-bottom: 1px solid #2a2a3e;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            position: relative;
        }
        
        .logo h1 {
            color: #e94560;
            font-size: 1.4rem;
            letter-spacing: 1px;
            margin: 0;
        }
        
        .logo p {
            color: #888;
            font-size: 0.7rem;
            margin: 2px 0 0;
        }
        
        .mode-switch {
            display: flex;
            gap: 12px;
            background: #0a0a0f;
            padding: 6px;
            border-radius: 40px;
            border: 1px solid #2a2a3e;
        }
        
        .mode-btn {
            padding: 8px 24px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.85rem;
            transition: all 0.2s ease;
            color: #aaa;
            background: transparent;
            border: none;
        }
        
        .mode-btn i {
            margin-right: 8px;
        }
        
        .mode-btn.active {
            background: #e94560;
            color: white;
            box-shadow: 0 0 15px rgba(233,69,96,0.3);
        }
        
        .mode-btn:not(.active):hover {
            background: #1a1a2e;
            color: #e94560;
        }
        
        .map-container {
            position: relative;
            height: calc(100vh - 70px);
            width: 100%;
        }
        
        #map {
            height: 100%;
            width: 100%;
            background: #0a0a0a;
        }
        
        .stats-panel {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(10,10,20,0.9);
            backdrop-filter: blur(10px);
            padding: 12px 18px;
            border-radius: 12px;
            border-left: 3px solid #e94560;
            z-index: 1000;
            font-size: 11px;
            color: #ccc;
            font-family: monospace;
            pointer-events: none;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        
        .stats-panel h4 {
            color: #e94560;
            margin: 0 0 8px 0;
            font-size: 12px;
        }
        
        .stats-panel hr {
            border-color: #2a2a3e;
            margin: 6px 0;
        }
        
        .legend {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(10,10,20,0.95);
            backdrop-filter: blur(10px);
            padding: 12px 18px;
            border-radius: 12px;
            z-index: 1000;
            font-size: 11px;
            color: #ccc;
            pointer-events: none;
            border: 1px solid #2a2a3e;
            font-family: monospace;
            min-width: 180px;
        }
        
        .legend h4 {
            color: #e94560;
            margin: 0 0 8px 0;
            font-size: 12px;
        }
        
        .legend hr {
            border-color: #2a2a3e;
            margin: 6px 0;
        }
        
        .legend-color {
            display: inline-block;
            width: 14px;
            height: 14px;
            border-radius: 3px;
            margin-right: 8px;
            vertical-align: middle;
        }
        
        .legend-item {
            margin-bottom: 5px;
        }
        
        .legend-icon {
            display: inline-block;
            width: 14px;
            margin-right: 8px;
            text-align: center;
            vertical-align: middle;
        }
        
        .leaflet-control-layers {
            border-radius: 8px !important;
            background: #1a1a2e !important;
            color: white !important;
            border: 1px solid #2a2a3e !important;
        }
        
        .leaflet-control-layers-expanded {
            background: #1a1a2e !important;
        }
        
        .leaflet-control-layers-selector {
            background: #2a2a3e !important;
        }
    </style>

            Высота: 483 км<br>
            Радиус: 2528.0 км<br>
            Интенсивность: 27.531
        `).addTo(dayGroup13);

        // Зона покрытия
        L.circle([4.21924981485086, 163.76291512686896], {
            radius: 2527920.7050484894,
            color: '#3498db',
            weight: 1.5,
            fill: false,
            opacity: 0.5
        }).bindPopup(`
            <b>День 13</b><br>
            🛰️ Зона покрытия<br>
            Радиус: 2527.9 км<br>
            Интенсивность: 27.824
        `).addTo(dayGroup13);
        
        // Маркер спутника
        var iconColor13_47 = 27.8241555428977 < 0.3 ? '#87ceeb' : 
                                   (27.8241555428977 < 0.6 ? '#90ee90' : 
                                   (27.8241555428977 < 0.8 ? '#ffa500' : '#ff4444'));
        
        L.marker([4.21924981485086, 163.76291512686896], {
            icon: L.divIcon({
                html: '<i class="fas fa-satellite" style="color: ' + iconColor13_47 + '; font-size: 20px; text-shadow: 0 0 3px black;"></i>',
                iconSize: [24, 24],
                className: 'sat-marker'
            })
        }).bindPopup(`
            <b>День 13</b><br>
            🛰️ Позиция спутника<br>
            Высота: 483 км<br>
            Радиус: 2527.9 км<br>
            Интенсивность: 27.824
        `).addTo(dayGroup13);

        satLayers['📅 День 13'] = dayGroup13;

        // Контрол слоёв
        var layerControl = L.control.layers(null, emLayers, {collapsed: false}).addTo(map);
        
        // Активируем первый слой
        allHeat.addTo(map);
        
        var currentMode = 'em';
        
        function switchMode(mode) {
            // Очищаем карту от всех слоёв кроме подложки и контрола
            map.eachLayer(function(layer) {
                if (layer !== map._layers[Object.keys(map._layers)[0]] && 
                    !layer._url && 
                    layer !== layerControl &&
                    layer !== map.attributionControl &&
                    layer !== map.scaleControl) {
                    map.removeLayer(layer);
                }
            });
            
            if (layerControl) {
                map.removeControl(layerControl);
            }
            
            if (mode === 'em') {
                layerControl = L.control.layers(null, emLayers, {collapsed: false}).addTo(map);
                allHeat.addTo(map);
            } else {
                layerControl = L.control.layers(null, satLayers, {collapsed: false}).addTo(map);
            }
            
            currentMode = mode;
        }
        
        document.getElementById('modeEm').addEventListener('click', function() {
            document.getElementById('modeEm').classList.add('active');
            document.getElementById('modeSat').classList.remove('active');
            switchMode('em');
        });
        
        document.getElementById('modeSat').addEventListener('click', function() {
            document.getElementById('modeSat').classList.add('active');
            document.getElementById('modeEm').classList.remove('active');
            switchMode('sat');
        });
        
        console.log('✅ Карта загружена');
    </script>
</body>
