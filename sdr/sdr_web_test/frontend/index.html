<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SDR Трансляция</title>
    <link rel="stylesheet" href="/sdr/static/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>SDR Трансляция</h1>
            <div class="status">
                <span id="connection-status" class="status-item">Отключено</span>
                <span id="recording-status" class="status-item">Не записывается</span>
            </div>
        </header>

        <main>
            <!-- Спектрограмма -->
            <section class="spectrum-section">
                <div id="pass-status" class="pass-status">ИДЁТ ПРОЛЁТ!</div>

                <!-- АЧХ — горизонтальный спектр (live) -->
                <div class="spectrum-line-wrap">
                    <div class="spectrum-line-title">АЧХ — амплитудно-частотная характеристика</div>
                    <canvas id="spectrum-line-canvas" width="1024" height="160"></canvas>
                </div>

                <div class="spectrum-container">
                    <canvas id="waterfall-canvas" width="1024" height="300"></canvas>
                    <div class="frequency-scale" id="frequency-scale"></div>
                </div>
                <div class="spectrum-controls">
                    <label>Яркость: <input type="range" id="intensity-slider" min="0" max="100" value="50"></label>
                    <label>Контраст: <input type="range" id="contrast-slider" min="0" max="100" value="50"></label>
                </div>
            </section>

            <!-- Временная шкала -->
            <section class="timeline-section">
                <h3>Временная шкала (-48 часов)</h3>
                <canvas id="timeline-canvas" class="timeline-canvas"></canvas>
                <div id="timeline-controls" class="timeline-controls-container"></div>
            </section>

            <div class="panels">
                <!-- Информация о сигнале -->
                <section class="panel">
                    <h2>Параметры сигнала</h2>
                    <div id="signal-info" class="info-content">
                        <p>Нет данных о сигнале</p>
                    </div>
                </section>

                <!-- Прогнозы пролетов -->
                <section class="panel">
                    <h2>Прогнозы пролетов</h2>
                    <div id="satellite-passes" class="info-content">
                        <p>Нет данных о пролетах</p>
                    </div>
                </section>

                <!-- Управление записью -->
                <section class="panel">
                    <h2>Запись</h2>
                    <div class="controls">
                        <button id="start-recording-btn" class="btn btn-start">Начать запись</button>
                        <button id="stop-recording-btn" class="btn btn-stop" disabled>Остановить запись</button>
                    </div>
                    <div id="recording-info" class="info-content">
                        <p>Готов к записи</p>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <script src="/sdr/static/waterfall.js"></script>
    <script src="/sdr/static/timeline.js"></script>
    <script>
        let websocket = null;
        let waterfallRenderer = null;
        let timelinePlayer = null;

        document.addEventListener('DOMContentLoaded', function() {
            initializeApp();
        });

        async function initializeApp() {
            waterfallRenderer = new WaterfallRenderer('waterfall-canvas', 'spectrum-line-canvas');
            timelinePlayer = new TimelinePlayer('timeline-canvas', 'timeline-controls');
            connectWebSocket();
            
            await loadSystemInfo();
            await loadSignalInfo();
            await loadSatellitePasses();
            await loadRecordingState();
            
            setupEventListeners();
            setInterval(updateStatus, 5000);
        }

        function connectWebSocket() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/sdr/ws/sdr`;
            
            websocket = new WebSocket(wsUrl);
            
            websocket.onopen = function() {
                document.getElementById('connection-status').textContent = 'Подключено';
                document.getElementById('connection-status').className = 'status-item connected';
                // Обновляем данные при подключении
                loadSignalInfo();
                loadSatellitePasses();
            };
            
            websocket.onclose = function() {
                document.getElementById('connection-status').textContent = 'Отключено';
                document.getElementById('connection-status').className = 'status-item disconnected';
                setTimeout(connectWebSocket, 3000);
            };
            
            websocket.onmessage = function(event) {
                const data = JSON.parse(event.data);
                if (data.type === 'fft_frame') {
                    waterfallRenderer.addFFTFrame(data.fft_data, data.center_frequency, data.sample_rate);
                } else if (data.type === 'auto_recording_stopped') {
                    console.log('Auto-recording stopped:', data.filename);
                    // Auto-download the completed auto-recording
                    const link = document.createElement('a');
                    link.href = `/sdr/api/download/${data.filename}`;
                    link.download = data.filename;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    console.log('Auto-downloaded:', data.filename);
                }
            };
            
            websocket.onerror = function(error) {
                console.error('WebSocket error:', error);
            };
        }

        async function loadSystemInfo() {
            try {
                const response = await fetch('/sdr/api/info');
                const info = await response.json();
                // System info loaded
            } catch (error) {
                console.error('Failed to load system info:', error);
            }
        }

        async function loadSignalInfo() {
            try {
                const response = await fetch('/sdr/api/signal/info');
                if (response.ok) {
                    const signalInfo = await response.json();
                    displaySignalInfo(signalInfo);
                } else {
                    console.log('No signal info available:', response.status);
                    document.getElementById('signal-info').innerHTML = '<p>Нет данных о сигнале. Отправьте пролеты и параметры спектра.</p>';
                }
            } catch (error) {
                console.error('Failed to load signal info:', error);
                document.getElementById('signal-info').innerHTML = '<p>Ошибка загрузки данных о сигнале</p>';
            }
        }

        async function loadSatellitePasses() {
            try {
                const response = await fetch('/sdr/api/passes');
                const passes = await response.json();
                displaySatellitePasses(passes);
            } catch (error) {
                console.error('Failed to load satellite passes:', error);
            }
        }

        async function loadRecordingState() {
            try {
                const response = await fetch('/sdr/api/record/state');
                const state = await response.json();
                updateRecordingUI(state);
            } catch (error) {
                console.error('Failed to load recording state:', error);
            }
        }

        function displaySignalInfo(info) {
            const container = document.getElementById('signal-info');
            container.innerHTML = `
                <div class="param-group">
                    <h3>Ближайший спутник</h3>
                    <div class="param satellite-name">${info.satellite_name}</div>
                </div>
                <div class="param-group">
                    <h3>Частоты</h3>
                    <div class="param">Спутник: ${(info.frequency / 1e6).toFixed(3)} МГц</div>
                    <div class="param">Центральная: ${(info.center_frequency / 1e6).toFixed(3)} МГц</div>
                    <div class="param">Дискретизация: ${(info.sample_rate / 1000).toFixed(1)} кГц</div>
                </div>
                <div class="param-group">
                    <h3>Параметры сигнала</h3>
                    <div class="param">Полоса: ${info.bandwidth} кГц</div>
                    <div class="param">Spreading Factor: ${info.spreading_factor}</div>
                    <div class="param">Coding Rate: ${info.coding_rate}</div>
                    <div class="param">Sync Word: ${info.sync_word}</div>
                    <div class="param">Preamble: ${info.preamble_length} символов</div>
                    <div class="param">CRC: ${info.crc_enabled ? 'Включен' : 'Отключен'}</div>
                </div>
                <div class="param-group">
                    <h3>Спектр</h3>
                    <div class="param">FFT размер: ${info.fft_size}</div>
                    <div class="param">FPS: ${info.fps}</div>
                </div>
            `;
        }

        function displaySatellitePasses(passes) {
            const container = document.getElementById('satellite-passes');
            
            if (passes.length === 0) {
                container.innerHTML = '<p>Нет данных о пролетах</p>';
                return;
            }
            
            const passesHtml = passes.map(pass => `
                <div class="pass-item">
                    <div class="pass-header">
                        <strong>${pass.satellite_name}</strong>
                        <span class="elevation">${pass.max_elevation.toFixed(1)}°</span>
                    </div>
                    <div class="pass-times">
                        Начало: ${new Date(pass.aos_time).toLocaleString('ru')}<br>
                        Конец: ${new Date(pass.los_time).toLocaleString('ru')}
                    </div>
                    ${pass.frequency ? `<div class="pass-freq">${(pass.frequency / 1e6).toFixed(3)} МГц</div>` : ''}
                    ${pass.notes ? `<div class="pass-notes">${pass.notes}</div>` : ''}
                </div>
            `).join('');
            
            container.innerHTML = passesHtml;
        }

        function updateRecordingUI(state) {
            const startBtn = document.getElementById('start-recording-btn');
            const stopBtn = document.getElementById('stop-recording-btn');
            const recordingInfo = document.getElementById('recording-info');
            const recordingStatus = document.getElementById('recording-status');
            
            if (state.is_recording) {
                startBtn.disabled = true;
                stopBtn.disabled = false;
                recordingStatus.textContent = 'Записывается';
                recordingStatus.className = 'status-item recording';
                
                const sizeKB = (state.file_size_bytes / 1024).toFixed(1);
                const duration = state.start_time ? 
                    Math.floor((new Date() - new Date(state.start_time)) / 1000) : 0;
                
                recordingInfo.innerHTML = `
                    <div class="param">Файл: ${state.filename}</div>
                    <div class="param">Размер: ${sizeKB} КБ</div>
                    <div class="param">Длительность: ${duration}с</div>
                `;
            } else {
                startBtn.disabled = false;
                stopBtn.disabled = true;
                recordingStatus.textContent = 'Не записывается';
                recordingStatus.className = 'status-item';
                recordingInfo.innerHTML = '<p>Готов к записи</p>';
            }
        }

        function setupEventListeners() {
            document.getElementById('start-recording-btn').addEventListener('click', startRecording);
            document.getElementById('stop-recording-btn').addEventListener('click', stopRecording);
            
            document.getElementById('intensity-slider').addEventListener('input', function(e) {
                waterfallRenderer.setIntensity(e.target.value / 100);
            });
            
            document.getElementById('contrast-slider').addEventListener('input', function(e) {
                waterfallRenderer.setContrast(e.target.value / 100);
            });
        }

        async function startRecording() {
            try {
                const response = await fetch('/sdr/api/record/start', { method: 'POST' });
                const result = await response.json();
                
                if (response.ok) {
                    console.log('Recording started:', result.filename);
                    await loadRecordingState();
                } else {
                    alert('Ошибка начала записи: ' + result.detail);
                }
            } catch (error) {
                console.error('Error starting recording:', error);
                alert('Ошибка начала записи');
            }
        }

        async function stopRecording() {
            try {
                const response = await fetch('/sdr/api/record/stop', { method: 'POST' });
                const result = await response.json();
                
                if (response.ok) {
                    console.log('Recording stopped');
                    await loadRecordingState();
                    
                    // Auto-download the stopped recording
                    if (result.filename) {
                        console.log('Auto-downloading stopped recording:', result.filename);
                        const link = document.createElement('a');
                        link.href = `/sdr/api/download/${result.filename}`;
                        link.download = result.filename;
                        document.body.appendChild(link);
                        link.click();
                        document.body.removeChild(link);
                    }
                } else {
                    alert('Ошибка остановки записи: ' + result.detail);
                }
            } catch (error) {
                console.error('Error stopping recording:', error);
                alert('Ошибка остановки записи');
            }
        }

        async function updateStatus() {
            await loadRecordingState();
            await loadSignalInfo(); // Добавляем обновление данных о сигнале
        }
    </script>
</body>
</html>
