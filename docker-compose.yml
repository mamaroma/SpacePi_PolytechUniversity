
services:

  # ── PostgreSQL database ───────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: spacepi
      POSTGRES_PASSWORD: spacepi
      POSTGRES_DB: spacepi
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spacepi -d spacepi"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Python / FastAPI backend ─────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql+psycopg2://spacepi:spacepi@db:5432/spacepi"
      CORS_ALLOW_ORIGINS: "*"
      # Архивные CSV (телеметрия PU-1..PU-6 и AIS-сессии), смонтированы ниже
      TELEAIS_DATA_DIR: "/app/tele-ais_data"
    volumes:
      # Persist Telethon session file (re-use existing session)
      - ./telemetry_session.session:/app/telemetry_session.session
      # Persist uploaded news images for API and VK crosspost
      - ./data/news/images:/app/data/news/images
      # Mount SDR data directory (contains nothing.iq and recordings)
      - ./sdr/sdr_web_test/data:/app/sdr/sdr_web_test/data
      # Архив телеметрии и AIS (read-only) — на сервере положен в /opt/spacepi
      - ./tele-ais_data:/app/tele-ais_data:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/api/satellites"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  # ── React + nginx frontend ───────────────────────────────────
  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
      args:
        # Empty = use relative /api/... URLs; nginx proxies them to api:8000
        VITE_API_BASE: ""
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy

# ── Named volumes ─────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local
